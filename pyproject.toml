[project]
name = "coral-voice-ai-agent-reu"
version = "0.1.0"
description = "Multimodal AI Dialogue Agent for Child-Robot Instruction Grounding"
readme = "README.md"
requires-python = ">=3.12"
# Mac-side deps only. The Pi nodes (rospy, mediapipe, torch, opencv, ...) install
# separately on the robot — see pi/README.md.
dependencies = [
    "roslibpy>=1.7.0",
    "openai>=1.0.0",
    "faster-whisper>=1.2.1",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
director = "coral_agent.director_node:main"
audio = "coral_agent.audio_node:main"
speaker = "coral_agent.speaker_node:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mac/coral_agent"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
