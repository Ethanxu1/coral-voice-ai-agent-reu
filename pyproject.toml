[project]
name = "coral-voice-ai-agent-reu"
version = "0.1.0"
description = "Multimodal AI Dialogue Agent for Child-Robot Instruction Grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "loguru>=0.7.3",
    "ollama>=0.6.1",
    "pipecat-ai[daily,openai,silero]>=0.0.108",
    "python-dotenv>=1.2.2",
]

[project.scripts]
bot-test = "coral_agent.bot:run"
llm-test = "coral_agent.test_local:test_dialogue"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coral_agent"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
