[project]
name = "coral-voice-ai-agent-reu"
version = "0.1.0"
description = "Multimodal AI Dialogue Agent for Child-Robot Instruction Grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "openai>=1.0.0",
    "mujoco>=3.0.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "websockets>=15.0.1",
    "langfuse>=4.1.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Multi-modal subject re-identification. InsightFace ArcFace embeddings for
# face identity + HSV torso/legs histograms for appearance fallback. Install:
#   uv sync --extra reid
# First run of multi-person mode downloads ~50MB (buffalo_s pack) to
# ~/.insightface/models/.
reid = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
]

[project.scripts]
server = "app.main:main"
robot = "app.main:main_robot"
sim-test = "app.main:main_sim_test"
vision = "app.vision.vision_server:main"
# Manual dev harnesses (not packaged) live in backend/tools/; run them with
# `uv run python backend/tools/<name>.py`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The backend lives under backend/app and is importable as the `app` package
# (app.main, app.robot, app.vision, ...).
# `only-include = ["backend/app"]` ships everything under backend/app;
# `sources = ["backend"]` tells hatchling that backend/ is the parent of the
# package directories, so `backend/app/` becomes the importable `app` package.
only-include = ["backend/app"]
sources = ["backend"]

[tool.pytest.ini_options]
# backend/ on the path so `import app` works without an install. Manual
# hardware/sim harnesses live in backend/tools/, outside the test tree.
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
