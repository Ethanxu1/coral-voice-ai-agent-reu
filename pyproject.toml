[project]
name = "coral-voice-ai-agent-reu"
version = "0.1.0"
description = "Multimodal AI Dialogue Agent for Child-Robot Instruction Grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "openai>=1.0.0",
    "mujoco>=3.0.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "websockets>=15.0.1",
    "langfuse>=4.1.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "pyttsx3>=2.90",
    "qwen-tts>=0.1.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# Pi-side only: the MobileNetV3 pose classifier loaded by robot_server.py.
# Not installed on the Mac (torch is heavy and only the robot needs it).
robot = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# SMPL shape calibration (Phase 2). Optional because the SMPL weights are gated
# behind academic registration and torch is heavy. Install with:
#   uv sync --extra smpl
#
# Use the .npz form of SMPL_NEUTRAL — the legacy .pkl needs chumpy, which has a
# broken build under Python 3.12. The repo README has a one-liner conversion.
smpl = [
    "torch>=2.3",
    "smplx>=0.1.28",
    "trimesh>=4.0",  # debug visualization only
]

# Multi-modal subject re-identification. InsightFace ArcFace embeddings for
# face identity + HSV torso/legs histograms for appearance fallback. Install:
#   uv sync --extra reid
# First run of multi-person mode downloads ~50MB (buffalo_s pack) to
# ~/.insightface/models/.
reid = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
]

[project.scripts]
server = "app.main:main"
robot = "app.main:main_robot"
sim-test = "app.main:main_sim_test"
speaker = "app.speaker.speaker_server:main"
vision = "app.vision.vision_server:main"
# collision-test / leg-bucket-test moved to backend/tests/ (dev harnesses, not packaged);
# run directly: `python backend/tests/collision_test.py`, `python backend/tests/leg_bucket_test.py`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The backend lives under backend/app. Each subdirectory (robot, vision, llm,
# simulator, speaker, collision) becomes a top-level package inside the wheel,
# and the loose modules (main.py, validation.py, state_manager.py,
# follow_controller.py) sit at the wheel root as `app.*`.
# `only-include = ["backend/app"]` ships everything under backend/app;
# `sources = ["backend"]` tells hatchling that backend/ is the parent of the
# package directories, so `backend/app/` becomes the importable `app` package.
only-include = ["backend/app"]
sources = ["backend"]

[tool.pytest.ini_options]
# backend/app on the path so tests import the app packages without an install;
# only collect real tests (test_*.py) — the *_test.py files are manual harnesses.
pythonpath = ["backend/app"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.11.0",
    "pyinstaller-hooks-contrib>=2024.10",
]
