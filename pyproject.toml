[project]
name = "coral-voice-ai-agent-reu"
version = "0.1.0"
description = "Multimodal AI Dialogue Agent for Child-Robot Instruction Grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "openai>=1.0.0",
    "mujoco>=3.0.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "websockets>=15.0.1",
    "langfuse>=4.1.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "pyttsx3>=2.90",
    "qwen-tts>=0.1.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# Pi-side only: the MobileNetV3 pose classifier loaded by robot_server.py.
# Not installed on the Mac (torch is heavy and only the robot needs it).
robot = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# SMPL shape calibration (Phase 2). Optional because the SMPL weights are gated
# behind academic registration and torch is heavy. Install with:
#   uv sync --extra smpl
#
# Use the .npz form of SMPL_NEUTRAL — the legacy .pkl needs chumpy, which has a
# broken build under Python 3.12. The repo README has a one-liner conversion.
smpl = [
    "torch>=2.3",
    "smplx>=0.1.28",
    "trimesh>=4.0",  # debug visualization only
]

# Multi-modal subject re-identification. InsightFace ArcFace embeddings for
# face identity + HSV torso/legs histograms for appearance fallback. Install:
#   uv sync --extra reid
# First run of multi-person mode downloads ~50MB (buffalo_s pack) to
# ~/.insightface/models/.
reid = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
]

[project.scripts]
server = "server:main"
robot = "server:main_robot"
sim-test = "server:main_sim_test"
speaker = "speaker.speaker_server:main"
vision = "vision.vision_server:main"
# collision-test / leg-bucket-test moved to tests/ (dev harnesses, not packaged);
# run directly: `python tests/collision_test.py`, `python tests/leg_bucket_test.py`.
# robot-agent / robot-server removed with the retired robot_agent.py / gen-2 Pi server.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat src layout: each dir under src/ is a top-level package (robot, vision,
# llm, simulator, speaker, collision) and the loose modules (server.py,
# validation.py, state.py, follow_controller.py, pose_db.py) sit at the wheel
# root. `only-include = ["src"]` ships everything under src/; `sources = ["src"]`
# strips the prefix so imports are `import server`, `from validation import …`.
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
# src on the path so tests import the top-level packages without an install;
# only collect real tests (test_*.py) — the *_test.py files under tests/ are
# manual harnesses (collision_test, leg_bucket_test, speaker_test, …), not suites.
pythonpath = ["src"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.11.0",
    "pyinstaller-hooks-contrib>=2024.10",
]
