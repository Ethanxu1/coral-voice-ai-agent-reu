[project]
name = "coral-voice-ai-agent-reu"
version = "0.1.0"
description = "Multimodal AI Dialogue Agent for Child-Robot Instruction Grounding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "openai>=1.0.0",
    "mujoco>=3.0.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "websockets>=15.0.1",
    "langfuse>=4.1.0",
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
# Pi-side only: the MobileNetV3 pose classifier loaded by robot_server.py.
# Not installed on the Mac (torch is heavy and only the robot needs it).
robot = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.scripts]
server = "coral_agent.server:main"
robot = "coral_agent.server:main_robot"
robot-server = "coral_agent.robot.nodes.robot_server:main"
speaker = "coral_agent.speaker.speaker_server:main"
vision = "coral_agent.vision.vision_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coral_agent"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
